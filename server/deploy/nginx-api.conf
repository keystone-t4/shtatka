# Штатка: api.штатка.рф → сервис сведений о компаниях. Файл: /etc/nginx/sites-available/shtatka-api
# Сертификат: certbot --nginx -d xn--80aa3a4ab7a.xn--p1ai -d api.xn--80aa3a4ab7a.xn--p1ai
limit_req_zone $binary_remote_addr zone=company:10m rate=20r/m;

server {
    listen 80;
    server_name api.xn--80aa3a4ab7a.xn--p1ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.xn--80aa3a4ab7a.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/api.xn--80aa3a4ab7a.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xn--80aa3a4ab7a.xn--p1ai/privkey.pem;

    location = /company {
        limit_req zone=company burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location = /passport {
        limit_req zone=company burst=5 nodelay;
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_read_timeout 40s;
        access_log off;   # тело с паспортом не логируем
    }

    location = /npd {
        limit_req zone=company burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;   # очередь к ФНС: до 3 запросов по 31 с
    }

    # Вход и подтверждение компании по ЭЦП. Host обязателен: он попадает в подписываемую строку
    location /auth/ {
        limit_req zone=company burst=5 nodelay;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location / { return 404; }
}
